services:
  inference-nvidia:
    build:
      context: .
      dockerfile: Dockerfile.inference.nvidia
    container_name: pawpile-inference-nvidia
    environment:
      SUPPORTED_DEVICES: nvidia
      LLAMA_SERVER_PATH: /opt/llama.cpp/build/bin/llama-server
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    restart: unless-stopped