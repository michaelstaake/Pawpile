services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pawpile-backend
    environment:
      INFERENCE_SERVICE_URL: http://inference-cpu:8100
      INFERENCE_RUNTIME_URLS: cpu=http://inference-cpu:8100,nvidia=http://inference-nvidia:8100,amd=http://inference-amd:8100,intel=http://inference-intel:8100
      SUPPORTED_DEVICES: ""
    volumes:
      - ./models:/app/models
      - pawpile-data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      inference-cpu:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pawpile-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  inference-cpu:
    build:
      context: .
      dockerfile: Dockerfile.inference.cpu
    container_name: pawpile-inference-cpu
    environment:
      SUPPORTED_DEVICES: cpu
      LLAMA_SERVER_PATH: /opt/llama.cpp/build/bin/llama-server
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pawpile-data:
